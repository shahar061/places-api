basePath: /
definitions:
  types.Area:
    properties:
      admin_level:
        type: integer
      area_key:
        type: string
      bbox:
        $ref: '#/definitions/types.BoundingBox'
      center:
        $ref: '#/definitions/types.Coordinate'
      country_code:
        type: string
      name:
        type: string
      refresh_queued:
        type: boolean
      refreshed_at:
        type: string
      type:
        description: country|region|city|locality|neighborhood
        type: string
    type: object
  types.BoundingBox:
    properties:
      east_lon:
        type: number
      north_lat:
        type: number
      south_lat:
        type: number
      west_lon:
        type: number
    type: object
  types.Coordinate:
    properties:
      lat:
        type: number
      lon:
        type: number
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A cache-first Places API for location search and discovery
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Places API
  version: "1.0"
paths:
  /healthcheck:
    get:
      consumes:
      - application/json
      description: Get the health status of the Places API service
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /v1/areas/resolve:
    get:
      consumes:
      - application/json
      description: Turn free-text queries like "Rome, Lazio, Italy" into canonical
        area keys with geometry.
      parameters:
      - description: Free-text location query
        in: query
        name: q
        required: true
        type: string
      - description: Return multiple candidates instead of best match
        in: query
        name: multi
        type: boolean
      - description: Queue background refresh for default categories
        in: query
        name: bootstrap
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Multiple area results when multi=true
          schema:
            items:
              $ref: '#/definitions/types.Area'
            type: array
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resolve area from text query
      tags:
      - areas
  /v1/places/top:
    get:
      consumes:
      - application/json
      description: Return ranked places for an area from cache
      parameters:
      - description: Canonical area key
        in: query
        name: area
        required: true
        type: string
      - description: Comma-separated categories (attraction,restaurant,cafe,bar,hotel)
        in: query
        name: cats
        type: string
      - description: 'Number of results (default: 50, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Offset for pagination (default: 0)'
        in: query
        name: offset
        type: integer
      - description: Language preference
        in: query
        name: lang
        type: string
      - description: Group results by category
        in: query
        name: group_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Top places response
          headers:
            X-Cache:
              description: Cache hit/miss status
              type: string
            X-Refresh-Queued:
              description: Whether refresh was queued
              type: string
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get top places for area
      tags:
      - places
schemes:
- http
- https
swagger: "2.0"
