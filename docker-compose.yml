services:
  # NATS JetStream server
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222" # NATS client port
      - "8222:8222" # HTTP monitoring port
    command: >
      --jetstream
      --store_dir=/data
      --http_port=8222
    volumes:
      - nats_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8222/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Places API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Server config
      - PLACES_API_SERVER_HOST=0.0.0.0
      - PLACES_API_SERVER_PORT=8080

      # Database config (you'll need to set these)
      - PLACES_API_DATABASE_SUPABASE_URL=${SUPABASE_URL}
      - PLACES_API_DATABASE_SUPABASE_KEY=${SUPABASE_KEY}

      # NATS config
      - PLACES_API_NATS_URL=nats://nats:4222
      - PLACES_API_NATS_CLUSTER_ID=places-cluster

      # AI config (optional)
      - PLACES_API_AI_OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}

      # Logging config
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_TIME_FORMAT=${LOG_TIME_FORMAT:-rfc3339}
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthcheck",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  nats_data:
    driver: local

networks:
  default:
    name: places_api_network
